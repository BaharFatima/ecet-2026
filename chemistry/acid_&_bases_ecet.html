<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acids & Bases — TS ECET Study Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans:ital,wght@0,300;0,400;0,700;1,400&display=swap');

  :root {
    --acid: #ff4d6d;
    --base: #4cc9f0;
    --neutral: #f8c31e;
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --text: #e2e8f0;
    --muted: #8896b3;
    --glow-acid: rgba(255,77,109,0.25);
    --glow-base: rgba(76,201,240,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--surface);
    border-right: 1px solid rgba(255,255,255,0.07);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }

  .logo { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .logo-tag { font-size: 10px; color: var(--neutral); letter-spacing: 3px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }
  .logo-title { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .logo-title span { color: var(--acid); }

  .nav-section { padding: 10px 0; }
  .nav-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); padding: 8px 18px 4px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px; cursor: pointer;
    font-size: 13px; color: var(--muted);
    transition: all 0.2s;
    border-left: 3px solid transparent;
    font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 0.5px;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-item.active { color: var(--text); border-left-color: var(--acid); background: rgba(255,77,109,0.08); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .progress-bar-mini { height: 3px; background: rgba(255,255,255,0.07); margin: 0 18px 12px; border-radius: 2px; }
  .progress-fill-mini { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--acid), var(--neutral)); transition: width 0.4s; }

  .main { flex: 1; overflow-y: auto; padding: 30px 36px; }

  .topic-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 28px; padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .topic-number { font-size: 11px; color: var(--muted); font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; margin-bottom: 6px; }
  .topic-title { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .topic-title span { color: var(--acid); }

  .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px; background: rgba(255,77,109,0.15); color: var(--acid); border: 1px solid rgba(255,77,109,0.3); }

  .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 22px 24px; margin-bottom: 18px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--acid), transparent); }
  .card.base-card::before { background: linear-gradient(90deg, var(--base), transparent); }
  .card.neutral-card::before { background: linear-gradient(90deg, var(--neutral), transparent); }

  .card-title { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 18px; }

  .theory-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .theory-box { background: var(--surface2); border-radius: 10px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); }
  .theory-name { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .theory-box.acid-t .theory-name { color: var(--acid); }
  .theory-box.base-t .theory-name { color: var(--base); }
  .theory-box.neutral-t .theory-name { color: var(--neutral); }
  .theory-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .theory-key { margin-top: 10px; font-size: 11px; background: rgba(255,255,255,0.04); border-radius: 6px; padding: 8px 10px; }
  .theory-key strong { display: block; font-size: 10px; letter-spacing: 1px; margin-bottom: 4px; color: var(--neutral); font-family: 'Rajdhani', sans-serif; }

  .limitation-list { list-style: none; }
  .limitation-list li { padding: 7px 0; font-size: 13px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.04); padding-left: 18px; position: relative; line-height: 1.5; }
  .limitation-list li::before { content: '✕'; position: absolute; left: 0; color: var(--acid); font-size: 10px; top: 9px; }
  .limitation-list li:last-child { border-bottom: none; }

  .ph-scale { height: 36px; border-radius: 8px; background: linear-gradient(90deg, #ff2244 0%, #ff6600 10%, #ffaa00 20%, #ccdd00 30%, #88cc00 40%, #44bb00 50%, #00aa44 60%, #0088bb 70%, #0066cc 80%, #4433dd 90%, #6600cc 100%); margin-bottom: 6px; }
  .ph-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: 'Rajdhani', sans-serif; }
  .ph-regions { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 12px; gap: 10px; }
  .ph-region { text-align: center; padding: 10px; border-radius: 8px; font-size: 12px; }
  .ph-region.acidic { background: rgba(255,77,109,0.12); border: 1px solid rgba(255,77,109,0.2); }
  .ph-region.neutral-r { background: rgba(248,195,30,0.12); border: 1px solid rgba(248,195,30,0.2); }
  .ph-region.basic { background: rgba(76,201,240,0.12); border: 1px solid rgba(76,201,240,0.2); }
  .ph-region .r-label { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .ph-region.acidic .r-label { color: var(--acid); }
  .ph-region.neutral-r .r-label { color: var(--neutral); }
  .ph-region.basic .r-label { color: var(--base); }

  .formula-box { background: var(--surface2); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px 18px; margin: 10px 0; font-family: 'Courier New', monospace; font-size: 14px; color: var(--neutral); display: flex; align-items: center; gap: 14px; }
  .formula-box .f-icon { font-size: 20px; }
  .formula-box .f-content { flex: 1; }
  .formula-box .f-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
  .formula-box .f-eq { font-size: 16px; }

  .mcq-card { background: var(--surface2); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .mcq-q { font-size: 13.5px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
  .mcq-q .qnum { color: var(--neutral); font-family: 'Rajdhani', sans-serif; font-weight: 700; margin-right: 6px; }
  .mcq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { padding: 9px 13px; border-radius: 7px; font-size: 12.5px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .mcq-opt:hover { background: rgba(255,255,255,0.08); }
  .mcq-opt.correct { background: rgba(76,201,240,0.15); border-color: rgba(76,201,240,0.4); color: var(--base); }
  .mcq-opt.wrong { background: rgba(255,77,109,0.12); border-color: rgba(255,77,109,0.3); color: var(--acid); }
  .mcq-opt .opt-letter { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; color: var(--muted); min-width: 16px; }
  .mcq-opt.correct .opt-letter { color: var(--base); }
  .mcq-opt.wrong .opt-letter { color: var(--acid); }
  .mcq-explanation { margin-top: 12px; padding: 10px 14px; border-radius: 7px; background: rgba(76,201,240,0.08); border: 1px solid rgba(76,201,240,0.15); font-size: 12px; color: var(--muted); line-height: 1.6; display: none; }
  .mcq-explanation.show { display: block; }
  .mcq-explanation strong { color: var(--base); }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0; }
  .compare-table th { background: rgba(255,255,255,0.06); padding: 10px 14px; text-align: left; font-family: 'Rajdhani', sans-serif; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .compare-table td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--muted); vertical-align: top; line-height: 1.5; }
  .compare-table tr:hover td { background: rgba(255,255,255,0.02); }
  .compare-table .acid-col { color: var(--acid); }
  .compare-table .base-col { color: var(--base); }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border-radius: 6px; font-size: 12px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: transparent; color: var(--muted); transition: all 0.2s; }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .tab.active { background: rgba(255,77,109,0.15); border-color: rgba(255,77,109,0.35); color: var(--acid); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); }

  .hl-acid { color: var(--acid); font-weight: 700; }
  .hl-base { color: var(--base); font-weight: 700; }
  .hl-neutral { color: var(--neutral); font-weight: 700; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0; }
  .info-box { background: var(--surface2); border-radius: 8px; padding: 14px; border: 1px solid rgba(255,255,255,0.06); }
  .info-box-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 6px; font-family: 'Rajdhani', sans-serif; }
  .info-box-val { font-size: 13px; line-height: 1.5; }

  .reaction { background: rgba(255,195,30,0.07); border: 1px solid rgba(255,195,30,0.15); border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 13px; margin: 8px 0; color: var(--neutral); }

  .tip-box { background: rgba(76,201,240,0.07); border-left: 3px solid var(--base); border-radius: 0 8px 8px 0; padding: 12px 14px; margin: 12px 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .tip-box strong { color: var(--base); display: block; margin-bottom: 4px; font-family: 'Rajdhani', sans-serif; font-size: 13px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .page { animation: fadeIn 0.3s ease; }

  .buffer-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 14px 0; }
  .buf-box { background: var(--surface2); border-radius: 8px; padding: 14px; text-align: center; font-size: 12px; border: 1px solid rgba(255,255,255,0.06); }
  .buf-box .buf-title { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .buf-arrow { text-align: center; font-size: 20px; color: var(--muted); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .indicator-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .ind-color { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1); }
  .ind-name { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; }
  .ind-range { font-size: 11px; color: var(--muted); }
  .nav-score { margin-left: auto; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12px; color: var(--neutral); }
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="logo">
    <div class="logo-tag">TS ECET Prep</div>
    <div class="logo-title">Acids <span>&</span> Bases</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Topics</div>
    <div class="nav-item active" onclick="showPage('intro')"><div class="dot" style="background:#ff4d6d"></div> Introduction</div>
    <div class="nav-item" onclick="showPage('theories')"><div class="dot" style="background:#f97316"></div> Theories & Limitations</div>
    <div class="nav-item" onclick="showPage('ionic')"><div class="dot" style="background:#f8c31e"></div> Ionic Product of Water</div>
    <div class="nav-item" onclick="showPage('ph')"><div class="dot" style="background:#4ade80"></div> pH & Numericals</div>
    <div class="nav-item" onclick="showPage('buffer')"><div class="dot" style="background:#4cc9f0"></div> Buffer Solutions</div>
    <div class="nav-item" onclick="showPage('indicators')"><div class="dot" style="background:#a78bfa"></div> Indicators (Ostwald)</div>
    <div class="nav-item" onclick="showPage('mcq')"><div class="dot" style="background:#fb7185"></div> Practice MCQs <span class="nav-score" id="scoreLabel">0/0</span></div>
  </div>
  <div style="padding:14px 18px;margin-top:auto;border-top:1px solid rgba(255,255,255,0.06);">
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-family:'Rajdhani',sans-serif;letter-spacing:1.5px;">MCQ SCORE</div>
    <div class="progress-bar-mini"><div class="progress-fill-mini" id="scoreBar" style="width:0%"></div></div>
    <div style="font-size:11px;color:var(--muted);" id="scoreFraction">0 correct of 0 attempted</div>
  </div>
</div>
<div class="main" id="mainContent"></div>
</div>

<script>
let mcqScore = 0, mcqAttempted = 0;

const pages = {
intro: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 01</div><div class="topic-title">Acids <span>&</span> Bases — Introduction</div></div>
    <div class="badge">CHEMISTRY</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">⚗️</span> What are Acids?</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;">An <span class="hl-acid">acid</span> is a substance that has sour taste, turns blue litmus red, and reacts with metals to produce hydrogen gas. Acids are proton donors or electron pair acceptors depending on the theory applied.</p>
    <div class="info-grid">
      <div class="info-box"><div class="info-box-label">COMMON EXAMPLES</div><div class="info-box-val" style="color:var(--acid)">HCl, H₂SO₄, HNO₃, CH₃COOH, HF</div></div>
      <div class="info-box"><div class="info-box-label">PROPERTIES</div><div class="info-box-val">Sour taste · pH &lt; 7 · Turns litmus red · Conducts electricity</div></div>
    </div>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">🧪</span> What are Bases?</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;">A <span class="hl-base">base</span> is a substance that has bitter taste, turns red litmus blue, and feels slippery. Bases are proton acceptors or electron pair donors.</p>
    <div class="info-grid">
      <div class="info-box"><div class="info-box-label">COMMON EXAMPLES</div><div class="info-box-val" style="color:var(--base)">NaOH, KOH, NH₃, Ca(OH)₂, Mg(OH)₂</div></div>
      <div class="info-box"><div class="info-box-label">PROPERTIES</div><div class="info-box-val">Bitter taste · pH &gt; 7 · Turns litmus blue · Slippery feel</div></div>
    </div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">⚖️</span> Neutralization Reaction</div>
    <div class="reaction">Acid + Base → Salt + Water</div>
    <div class="reaction">HCl + NaOH → NaCl + H₂O</div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6;">When an acid and base react, they neutralize each other to form a salt and water. This is an exothermic reaction.</p>
    <div class="tip-box"><strong>🎯 ECET EXAM TIP</strong>HCl + NaOH → NaCl (neutral salt, pH = 7). Strong acid + Strong base → neutral salt always.</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">📊</span> Strong vs Weak Acids & Bases</div>
    <table class="compare-table">
      <tr><th>Property</th><th class="acid-col">Strong</th><th class="base-col">Weak</th></tr>
      <tr><td>Dissociation</td><td class="acid-col">Complete (100%)</td><td class="base-col">Partial</td></tr>
      <tr><td>Acid examples</td><td class="acid-col">HCl, H₂SO₄, HNO₃, HBr, HI</td><td class="base-col">CH₃COOH, H₂CO₃, H₃PO₄</td></tr>
      <tr><td>Base examples</td><td class="acid-col">NaOH, KOH, Ca(OH)₂</td><td class="base-col">NH₄OH, Al(OH)₃</td></tr>
      <tr><td>Conductivity</td><td class="acid-col">High</td><td class="base-col">Low</td></tr>
    </table>
  </div>
</div>`,

theories: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 02</div><div class="topic-title">Theories <span>&</span> Limitations</div></div>
    <div class="badge">HIGH WEIGHTAGE</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">📚</span> The Three Major Theories</div>
    <div class="theory-grid">
      <div class="theory-box acid-t">
        <div class="theory-name">1. Arrhenius Theory (1884)</div>
        <div class="theory-text">Proposed by Svante Arrhenius. Based on ionization in water.</div>
        <div class="theory-key"><strong>ACID</strong>Produces H⁺ ions in water<br>HCl → H⁺ + Cl⁻<hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:8px 0"><strong>BASE</strong>Produces OH⁻ ions in water<br>NaOH → Na⁺ + OH⁻</div>
      </div>
      <div class="theory-box base-t">
        <div class="theory-name">2. Brønsted–Lowry Theory (1923)</div>
        <div class="theory-text">Proposed by Brønsted and Lowry. Based on proton transfer.</div>
        <div class="theory-key"><strong>ACID</strong>Proton (H⁺) DONOR<br>NH₄⁺ → NH₃ + H⁺<hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:8px 0"><strong>BASE</strong>Proton (H⁺) ACCEPTOR<br>NH₃ + H⁺ → NH₄⁺</div>
      </div>
      <div class="theory-box neutral-t">
        <div class="theory-name">3. Lewis Theory (1923)</div>
        <div class="theory-text">Proposed by G.N. Lewis. Based on electron pair sharing.</div>
        <div class="theory-key"><strong>ACID</strong>Electron pair ACCEPTOR<br>BF₃ accepts lone pair<hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:8px 0"><strong>BASE</strong>Electron pair DONOR<br>NH₃ donates lone pair</div>
      </div>
    </div>
    <div class="tip-box"><strong>🔑 KEY CONCEPT: Conjugate Acid-Base Pair</strong>When an acid donates H⁺, the remaining species is its <span class="hl-base">conjugate base</span>. Example: CH₃COOH (acid) ⇌ CH₃COO⁻ (conjugate base) + H⁺</div>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">⚠️</span> Limitations of Each Theory</div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'lim-arr')">Arrhenius</div>
      <div class="tab" onclick="switchTab(this,'lim-bl')">Brønsted-Lowry</div>
      <div class="tab" onclick="switchTab(this,'lim-lew')">Lewis</div>
    </div>
    <div class="tab-content active" id="lim-arr">
      <ul class="limitation-list">
        <li>Applicable <strong>only in aqueous (water) solutions</strong> — fails for non-aqueous solvents</li>
        <li>Cannot explain HCl gas + NH₃ gas = NH₄Cl (no water involved)</li>
        <li>Cannot explain why NH₃ is a base (it has no OH⁻)</li>
        <li>Cannot explain why BF₃ acts as a Lewis acid</li>
        <li>Does not explain acidity of CO₂, SO₂, SO₃</li>
      </ul>
    </div>
    <div class="tab-content" id="lim-bl">
      <ul class="limitation-list">
        <li>Requires proton transfer — cannot explain reactions without H⁺</li>
        <li>Cannot explain why BF₃, AlCl₃ are acids (no proton involved)</li>
        <li>Fails for SO₃, CO₂ which are acidic but have no H⁺ to donate</li>
        <li>Not applicable to non-protic systems</li>
      </ul>
    </div>
    <div class="tab-content" id="lim-lew">
      <ul class="limitation-list">
        <li>Very broad — many reactions included that aren't truly acid-base</li>
        <li>Difficult to quantify Lewis acid-base strength</li>
        <li>No universal strength scale for Lewis acids and bases</li>
        <li>Cannot directly explain simple neutralization concept</li>
      </ul>
    </div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">🔬</span> Comparison Table</div>
    <table class="compare-table">
      <tr><th>Feature</th><th>Arrhenius</th><th>Brønsted-Lowry</th><th>Lewis</th></tr>
      <tr><td>Year</td><td>1884</td><td>1923</td><td>1923</td></tr>
      <tr><td>Acid defined as</td><td>H⁺ producer</td><td>H⁺ donor</td><td>e⁻ pair acceptor</td></tr>
      <tr><td>Base defined as</td><td>OH⁻ producer</td><td>H⁺ acceptor</td><td>e⁻ pair donor</td></tr>
      <tr><td>Medium required</td><td>Water only</td><td>Protic solvents</td><td>Any</td></tr>
      <tr><td>Scope</td><td>Narrowest</td><td>Broader</td><td>Broadest</td></tr>
    </table>
    <div class="tip-box" style="margin-top:12px"><strong>🎯 EXAM TRICK</strong>Lewis theory is MOST GENERAL. Order of broadness: Lewis &gt; Brønsted-Lowry &gt; Arrhenius</div>
  </div>
</div>`,

ionic: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 03</div><div class="topic-title">Ionic Product <span>of Water</span></div></div>
    <div class="badge">Kw</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">💧</span> Self-Ionization of Water</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;">Water is amphoteric — it can act as both acid AND base. It undergoes self-ionization (autoprotolysis):</p>
    <div class="reaction">H₂O + H₂O ⇌ H₃O⁺ + OH⁻</div>
    <div class="reaction">or simply: H₂O ⇌ H⁺ + OH⁻</div>
    <div class="formula-box">
      <div class="f-icon">🔑</div>
      <div class="f-content"><div class="f-label">IONIC PRODUCT OF WATER (Kw)</div><div class="f-eq">Kw = [H⁺][OH⁻] = 1 × 10⁻¹⁴ at 25°C (298 K)</div></div>
    </div>
    <div class="info-grid">
      <div class="info-box"><div class="info-box-label">AT 25°C (PURE WATER)</div><div class="info-box-val">[H⁺] = [OH⁻] = 10⁻⁷ mol/L<br>Kw = 10⁻¹⁴</div></div>
      <div class="info-box"><div class="info-box-label">TEMPERATURE EFFECT</div><div class="info-box-val">Kw <strong>increases</strong> with temperature (endothermic process)</div></div>
    </div>
    <div class="tip-box"><strong>⚠️ IMPORTANT FACTS</strong>• Kw = 10⁻¹⁴ only at 25°C<br>• Higher temperature → Kw &gt; 10⁻¹⁴<br>• Kw is temperature dependent, NOT pressure dependent<br>• Pure water: [H⁺] = [OH⁻] = 10⁻⁷ M → neutral</div>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">📐</span> [H⁺] and [OH⁻] Relationships</div>
    <table class="compare-table">
      <tr><th>Solution Type</th><th>[H⁺]</th><th>[OH⁻]</th><th>pH</th></tr>
      <tr><td>Acidic</td><td class="acid-col">&gt; 10⁻⁷ M</td><td class="base-col">&lt; 10⁻⁷ M</td><td class="acid-col">&lt; 7</td></tr>
      <tr><td>Neutral</td><td style="color:var(--neutral)">= 10⁻⁷ M</td><td style="color:var(--neutral)">= 10⁻⁷ M</td><td style="color:var(--neutral)">= 7</td></tr>
      <tr><td>Basic</td><td class="base-col">&lt; 10⁻⁷ M</td><td class="acid-col">&gt; 10⁻⁷ M</td><td class="base-col">&gt; 7</td></tr>
    </table>
    <div class="formula-box" style="margin-top:14px">
      <div class="f-icon">🔢</div>
      <div class="f-content"><div class="f-label">FIND [OH⁻] FROM [H⁺]</div><div class="f-eq">[OH⁻] = Kw / [H⁺] = 10⁻¹⁴ / [H⁺]</div></div>
    </div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">🧮</span> Solved Example</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">If [H⁺] = 10⁻³ M, find [OH⁻] and state nature of solution:</p>
    <div class="reaction">Kw = [H⁺][OH⁻] = 10⁻¹⁴</div>
    <div class="reaction">[OH⁻] = 10⁻¹⁴ / 10⁻³ = 10⁻¹¹ M</div>
    <div class="reaction">pH = -log[H⁺] = -log(10⁻³) = 3 → ACIDIC</div>
    <div class="tip-box"><strong>✅ Answer:</strong> [OH⁻] = 10⁻¹¹ M, pH = 3, Solution is ACIDIC (pH &lt; 7)</div>
  </div>
</div>`,

ph: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 04</div><div class="topic-title">pH <span>& Numerical Problems</span></div></div>
    <div class="badge">NUMERICALS</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">📏</span> pH Scale</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">pH was introduced by <span class="hl-neutral">Sørensen</span> in 1909. It measures H⁺ ion concentration.</p>
    <div class="formula-box"><div class="f-icon">🔑</div><div class="f-content"><div class="f-label">DEFINITION</div><div class="f-eq">pH = −log₁₀[H⁺]  OR  pH = −log₁₀[H₃O⁺]</div></div></div>
    <div class="formula-box"><div class="f-icon">🔑</div><div class="f-content"><div class="f-label">pOH DEFINITION</div><div class="f-eq">pOH = −log₁₀[OH⁻]</div></div></div>
    <div class="formula-box"><div class="f-icon">⚖️</div><div class="f-content"><div class="f-label">KEY RELATIONSHIP (at 25°C)</div><div class="f-eq">pH + pOH = 14  (= pKw)</div></div></div>
    <div style="margin-top:16px">
      <div class="ph-scale"></div>
      <div class="ph-labels"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span></div>
      <div class="ph-regions">
        <div class="ph-region acidic"><div class="r-label">ACIDIC</div>pH 0 – 6.9<br><span style="font-size:11px;color:var(--muted)">[H⁺] > [OH⁻]</span></div>
        <div class="ph-region neutral-r"><div class="r-label">NEUTRAL</div>pH = 7<br><span style="font-size:11px;color:var(--muted)">[H⁺] = [OH⁻]</span></div>
        <div class="ph-region basic"><div class="r-label">BASIC</div>pH 7.1 – 14<br><span style="font-size:11px;color:var(--muted)">[OH⁻] > [H⁺]</span></div>
      </div>
    </div>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">🧮</span> Formulas for Different Cases</div>
    <div class="theory-grid" style="grid-template-columns:1fr 1fr;">
      <div class="theory-box acid-t"><div class="theory-name">Strong Acid</div><div class="theory-text">Completely dissociates</div><div class="theory-key"><strong>FORMULA</strong>[H⁺] = Molarity (M)<br>pH = -log(M)</div></div>
      <div class="theory-box base-t"><div class="theory-name">Strong Base</div><div class="theory-text">Completely dissociates</div><div class="theory-key"><strong>FORMULA</strong>[OH⁻] = M<br>pOH = -log(M)<br>pH = 14 - pOH</div></div>
      <div class="theory-box neutral-t"><div class="theory-name">Weak Acid</div><div class="theory-text">Partial dissociation</div><div class="theory-key"><strong>FORMULA</strong>[H⁺] = √(Ka × C)<br>pH = ½(pKa – log C)</div></div>
      <div class="theory-box" style="border-color:rgba(167,139,250,0.2)"><div class="theory-name" style="color:#a78bfa">Weak Base</div><div class="theory-text">Partial dissociation</div><div class="theory-key"><strong>FORMULA</strong>[OH⁻] = √(Kb × C)<br>pOH = ½(pKb – log C)</div></div>
    </div>
    <div class="tip-box" style="margin-top:14px"><strong>📌 FORMULA SUMMARY</strong>• pH = -log[H⁺] &nbsp;|&nbsp; pOH = -log[OH⁻]<br>• pH + pOH = 14 &nbsp;|&nbsp; pKa + pKb = 14<br>• Ka × Kb = Kw = 10⁻¹⁴<br>• α (degree of dissociation) = √(Ka/C) for weak acid</div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">📝</span> Solved Problems</div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'num1')">Problem 1</div>
      <div class="tab" onclick="switchTab(this,'num2')">Problem 2</div>
      <div class="tab" onclick="switchTab(this,'num3')">Problem 3</div>
      <div class="tab" onclick="switchTab(this,'num4')">Problem 4</div>
    </div>
    <div class="tab-content active" id="num1">
      <p style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;">Q: Find pH of 0.01 M HCl solution.</p>
      <div class="reaction">HCl is a strong acid → completely dissociates</div>
      <div class="reaction">[H⁺] = 0.01 M = 10⁻² M</div>
      <div class="reaction">pH = -log(10⁻²) = 2</div>
      <div class="tip-box" style="margin-top:8px"><strong>✅ pH = 2 (Acidic)</strong></div>
    </div>
    <div class="tab-content" id="num2">
      <p style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;">Q: Find pH of 0.001 M NaOH solution.</p>
      <div class="reaction">NaOH is a strong base → [OH⁻] = 10⁻³ M</div>
      <div class="reaction">pOH = -log(10⁻³) = 3</div>
      <div class="reaction">pH = 14 - 3 = 11</div>
      <div class="tip-box" style="margin-top:8px"><strong>✅ pH = 11 (Basic)</strong></div>
    </div>
    <div class="tab-content" id="num3">
      <p style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;">Q: Ka = 1.8 × 10⁻⁵. Find pH of 0.1 M CH₃COOH.</p>
      <div class="reaction">[H⁺] = √(Ka × C) = √(1.8×10⁻⁵ × 0.1)</div>
      <div class="reaction">= √(1.8×10⁻⁶) = 1.34 × 10⁻³ M</div>
      <div class="reaction">pH = -log(1.34×10⁻³) ≈ 2.87</div>
      <div class="tip-box" style="margin-top:8px"><strong>✅ pH ≈ 2.87 (Weakly Acidic)</strong></div>
    </div>
    <div class="tab-content" id="num4">
      <p style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;">Q: If pH = 5, find [H⁺] and [OH⁻].</p>
      <div class="reaction">pH = 5 → [H⁺] = 10⁻⁵ M</div>
      <div class="reaction">pOH = 14 - 5 = 9 → [OH⁻] = 10⁻⁹ M</div>
      <div class="reaction">Verify: 10⁻⁵ × 10⁻⁹ = 10⁻¹⁴ = Kw ✓</div>
      <div class="tip-box" style="margin-top:8px"><strong>✅ [H⁺] = 10⁻⁵ M, [OH⁻] = 10⁻⁹ M — ACIDIC solution</strong></div>
    </div>
  </div>
</div>`,

buffer: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 05</div><div class="topic-title">Buffer Solutions</div></div>
    <div class="badge">APPLICATIONS</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">🛡️</span> What is a Buffer Solution?</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;">A <span class="hl-neutral">buffer solution</span> resists change in pH upon addition of small amounts of acid or base. It maintains a nearly constant pH.</p>
    <div class="two-col">
      <div class="theory-box acid-t"><div class="theory-name">Acidic Buffer (pH &lt; 7)</div><div class="theory-key"><strong>COMPOSITION</strong>Weak acid + Salt of weak acid with strong base<br><br>Example: CH₃COOH + CH₃COONa</div></div>
      <div class="theory-box base-t"><div class="theory-name">Basic Buffer (pH &gt; 7)</div><div class="theory-key"><strong>COMPOSITION</strong>Weak base + Salt of weak base with strong acid<br><br>Example: NH₄OH + NH₄Cl</div></div>
    </div>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">⚙️</span> Buffer Action — How It Works</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Using CH₃COOH / CH₃COONa buffer as example:</p>
    <div class="buffer-diagram">
      <div class="buf-box"><div class="buf-title" style="color:var(--acid)">Add ACID (H⁺)</div><div style="font-size:12px;color:var(--muted)">CH₃COO⁻ + H⁺ → CH₃COOH<br><br>Acetate ions absorb extra H⁺ → pH unchanged</div></div>
      <div class="buf-arrow">⇌</div>
      <div class="buf-box"><div class="buf-title" style="color:var(--base)">Add BASE (OH⁻)</div><div style="font-size:12px;color:var(--muted)">CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O<br><br>Acetic acid neutralizes OH⁻ → pH unchanged</div></div>
    </div>
    <div class="tip-box"><strong>🔑 KEY PRINCIPLE</strong>Buffer works because it contains BOTH the acid form AND conjugate base form. One neutralizes added acid, the other neutralizes added base.</div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">🧮</span> Henderson-Hasselbalch Equation</div>
    <div class="formula-box"><div class="f-icon">⚗️</div><div class="f-content"><div class="f-label">FOR ACIDIC BUFFER</div><div class="f-eq">pH = pKa + log([Salt] / [Acid])</div></div></div>
    <div class="formula-box"><div class="f-icon">⚗️</div><div class="f-content"><div class="f-label">FOR BASIC BUFFER</div><div class="f-eq">pOH = pKb + log([Salt] / [Base])</div></div></div>
    <div style="background:var(--surface2);border-radius:8px;padding:14px;margin-top:12px;">
      <div style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:8px;font-family:'Rajdhani',sans-serif;">NUMERICAL EXAMPLE</div>
      <p style="font-size:13px;color:var(--text);margin-bottom:8px;">Q: pKa = 4.74, [CH₃COOH] = 0.1M, [CH₃COONa] = 0.1M. Find pH.</p>
      <div class="reaction">pH = pKa + log([Salt]/[Acid]) = 4.74 + log(0.1/0.1)</div>
      <div class="reaction">= 4.74 + log(1) = 4.74 + 0 = 4.74</div>
      <div class="tip-box" style="margin-top:8px"><strong>✅ pH = 4.74 — When [Salt] = [Acid], pH = pKa</strong></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">🏥</span> Applications of Buffer Solutions</div>
    <table class="compare-table">
      <tr><th>Application</th><th>Buffer Used</th><th>pH Maintained</th></tr>
      <tr><td>Blood (biological)</td><td>H₂CO₃ / HCO₃⁻</td><td style="color:var(--neutral)">7.35 – 7.45</td></tr>
      <tr><td>Pharmaceutical drugs</td><td>Phosphate/citrate buffers</td><td>Specific pH</td></tr>
      <tr><td>Bacteriological media</td><td>Phosphate buffers</td><td>6.8 – 7.2</td></tr>
      <tr><td>Food preservation</td><td>Citrate/acetate</td><td>Acidic</td></tr>
      <tr><td>Analytical chemistry</td><td>Various</td><td>Standard pH</td></tr>
    </table>
    <div class="tip-box" style="margin-top:12px"><strong>🩸 MOST IMPORTANT APPLICATION</strong>Blood pH = 7.4 maintained by carbonate buffer. pH &lt; 7.35 = ACIDOSIS; pH &gt; 7.45 = ALKALOSIS</div>
  </div>
</div>`,

indicators: `<div class="page">
  <div class="topic-header">
    <div><div class="topic-number">TOPIC 06</div><div class="topic-title">Ostwald's Theory <span>of Indicators</span></div></div>
    <div class="badge">INDICATORS</div>
  </div>
  <div class="card">
    <div class="card-title"><span class="icon">🎨</span> What is an Indicator?</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;">An indicator is a substance that changes color depending on the pH. Indicators are <span class="hl-acid">weak acids</span> or <span class="hl-base">weak bases</span> whose undissociated and dissociated forms have different colors.</p>
  </div>
  <div class="card base-card">
    <div class="card-title"><span class="icon">🔬</span> Ostwald's Ionic Theory of Indicators</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;">Proposed by <span class="hl-base">Wilhelm Ostwald</span>. Indicators exist in equilibrium between two colored forms.</p>
    <div style="background:var(--surface2);border-radius:10px;padding:18px;margin-bottom:14px;">
      <div style="font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;font-family:'Rajdhani',sans-serif;">FOR INDICATOR AS WEAK ACID (HIn)</div>
      <div class="reaction">HIn ⇌ H⁺ + In⁻</div>
      <div class="reaction">(Acid form — Color 1)    (Base form — Color 2)</div>
      <div class="two-col" style="margin-top:12px;gap:10px">
        <div style="background:rgba(255,77,109,0.1);border-radius:8px;padding:12px;border:1px solid rgba(255,77,109,0.2);">
          <div style="font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--acid);margin-bottom:6px;">IN ACID MEDIUM</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.6;">High [H⁺] → equilibrium shifts LEFT → HIn predominates → Shows ACID COLOR</div>
        </div>
        <div style="background:rgba(76,201,240,0.1);border-radius:8px;padding:12px;border:1px solid rgba(76,201,240,0.2);">
          <div style="font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--base);margin-bottom:6px;">IN BASE MEDIUM</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.6;">OH⁻ neutralizes H⁺ → equilibrium shifts RIGHT → In⁻ predominates → Shows BASE COLOR</div>
        </div>
      </div>
    </div>
    <div class="tip-box"><strong>📌 KEY PRINCIPLE (Le Chatelier's Principle)</strong>Color change is due to equilibrium shift when H⁺ or OH⁻ is added to the solution.</div>
  </div>
  <div class="card neutral-card">
    <div class="card-title"><span class="icon">🌈</span> Common Indicators & Color Changes</div>
    <div class="indicator-row">
      <div class="ind-color" style="background:linear-gradient(90deg,#ff2244,#4cc9f0)"></div>
      <div><div class="ind-name">Litmus</div><div class="ind-range">pH: 5.0–8.0 &nbsp;|&nbsp; <span class="hl-acid">Red in acid</span> → <span class="hl-base">Blue in base</span></div></div>
    </div>
    <div class="indicator-row">
      <div class="ind-color" style="background:linear-gradient(90deg,#ff4444,#ffcc00)"></div>
      <div><div class="ind-name">Methyl Orange</div><div class="ind-range">pH: 3.1–4.4 &nbsp;|&nbsp; <span class="hl-acid">Red in acid</span> → <span style="color:#ffcc00;font-weight:700">Yellow in base</span></div><div style="font-size:11px;color:var(--muted);margin-top:2px">Use: Strong acid – Weak base titrations</div></div>
    </div>
    <div class="indicator-row">
      <div class="ind-color" style="background:linear-gradient(90deg,#ffcccc,#ff44ff)"></div>
      <div><div class="ind-name">Phenolphthalein</div><div class="ind-range">pH: 8.3–10.0 &nbsp;|&nbsp; <span style="color:#ffcccc;font-weight:700">Colourless in acid</span> → <span style="color:#ff44ff;font-weight:700">Pink in base</span></div><div style="font-size:11px;color:var(--muted);margin-top:2px">Use: Weak acid – Strong base titrations</div></div>
    </div>
    <div class="indicator-row">
      <div class="ind-color" style="background:linear-gradient(90deg,#ff8800,#ffee00)"></div>
      <div><div class="ind-name">Methyl Red</div><div class="ind-range">pH: 4.4–6.2 &nbsp;|&nbsp; <span style="color:#ff8800;font-weight:700">Red in acid</span> → <span style="color:#ffee00;font-weight:700">Yellow in base</span></div></div>
    </div>
    <table class="compare-table" style="margin-top:16px">
      <tr><th>Titration Type</th><th>Indicator</th><th>End Point pH</th></tr>
      <tr><td>Strong acid + Strong base</td><td style="color:var(--neutral)">Any (Litmus/MO/PP)</td><td style="color:var(--neutral)">~7</td></tr>
      <tr><td>Strong acid + Weak base</td><td class="acid-col">Methyl Orange</td><td class="acid-col">&lt; 7</td></tr>
      <tr><td>Weak acid + Strong base</td><td class="base-col">Phenolphthalein</td><td class="base-col">&gt; 7</td></tr>
      <tr><td>Weak acid + Weak base</td><td style="color:var(--muted)">No suitable indicator</td><td style="color:var(--muted)">—</td></tr>
    </table>
  </div>
</div>`,

  { q:"Which of the following is NOT a limitation of Arrhenius theory?", opts:["Cannot explain acidity in non-aqueous solvents","Cannot explain why BF₃ is an acid","Applies to all acid-base reactions","Cannot explain why NH₃ is a base"], ans:2, exp:"Option C is wrong as a claim — Arrhenius theory does NOT apply to all reactions. Options A, B, D are actual limitations. 'Applies to all reactions' is NOT a limitation." },

  { q:"Which of the following is an example of an acidic buffer?", opts:["NH₄OH + NH₄Cl","NaOH + NaCl","CH₃COOH + CH₃COONa","HCl + NaCl"], ans:2, exp:"<strong>CH₃COOH + CH₃COONa</strong> — weak acid + its sodium salt = classic acidic buffer. NH₄OH + NH₄Cl is a basic buffer." },
  { q:"Henderson-Hasselbalch equation for acidic buffer is:", opts:["pH = pKb + log([Salt]/[Base])","pH = pKa + log([Salt]/[Acid])","pH = pKw - pKa","pH = -log(Ka × C)"], ans:1, exp:"<strong>pH = pKa + log([Salt]/[Acid])</strong>. When [Salt] = [Acid], pH = pKa." },
  { q:"According to Ostwald's theory, an indicator is:", opts:["A strong acid that changes color","A salt that ionizes completely","A weak acid or weak base","A neutral substance"], ans:2, exp:"<strong>Ostwald's ionic theory</strong> — indicators are <strong>weak acids or weak bases</strong> whose ionized and unionized forms have different colors." },
  { q:"Which indicator is suitable for strong acid vs weak base titration?", opts:["Phenolphthalein","Litmus","Methyl Orange","All of the above"], ans:2, exp:"<strong>Methyl Orange</strong> (pH 3.1–4.4) is used for strong acid vs weak base. Phenolphthalein is for weak acid vs strong base." },
  { q:"BF₃ is a Lewis acid because it:", opts:["Donates H⁺ ions","Accepts electron pairs","Donates electron pairs","Produces OH⁻ ions"], ans:1, exp:"BF₃ is a <strong>Lewis acid</strong> because it <strong>accepts electron pairs</strong>. It has an empty p orbital." },
  { q:"The conjugate base of H₂O is:", opts:["H₃O⁺","OH⁻","O²⁻","H₂O₂"], ans:1, exp:"H₂O donates H⁺ → becomes <strong>OH⁻</strong>, its conjugate base. Conjugate base = acid minus one proton." },
  { q:"If pH + pOH = 14 and pOH = 5, what is [H⁺]?", opts:["10⁻⁵ M","10⁻⁹ M","10⁻¹⁴ M","10⁻⁷ M"], ans:1, exp:"pOH = 5 → pH = 14-5 = 9. Therefore <strong>[H⁺] = 10⁻⁹ M</strong>. Basic solution." },
  { q:"Which is the MOST GENERAL acid-base theory?", opts:["Arrhenius Theory","Brønsted-Lowry Theory","Lewis Theory","None of these"], ans:2, exp:"<strong>Lewis Theory</strong> is the most general — it includes all Brønsted-Lowry AND Arrhenius cases plus more." },
  { q:"Blood pH is maintained at ~7.4 by which buffer?", opts:["Phosphate buffer","Carbonate buffer (H₂CO₃/HCO₃⁻)","Acetate buffer","Ammonia buffer"], ans:1, exp:"Blood uses the <strong>carbonate buffer (H₂CO₃/HCO₃⁻)</strong>. pH &lt; 7.35 = acidosis; pH &gt; 7.45 = alkalosis." }
];

function renderMCQs() {
  const c = document.getElementById('mcq-container');
  if (!c) return;
  c.innerHTML = '';
  mcqs.forEach((mcq, i) => {
    const d = document.createElement('div');
    d.className = 'mcq-card';
    d.innerHTML = `<div class="mcq-q"><span class="qnum">Q${i+1}.</span>${mcq.q}</div>
      <div class="mcq-options">${mcq.opts.map((o,j)=>`<div class="mcq-opt" onclick="checkMCQ(this,${i},${j})"><span class="opt-letter">${['A','B','C','D'][j]}.</span> ${o}</div>`).join('')}</div>
      <div class="mcq-explanation" id="exp-${i}">${mcq.exp}</div>`;
    c.appendChild(d);
  });
}

function checkMCQ(el, qi, chosen) {
  const card = el.closest('.mcq-card');
  if (card.dataset.answered) return;
  card.dataset.answered = '1';
  mcqAttempted++;
  if (chosen === mcqs[qi].ans) { el.classList.add('correct'); mcqScore++; }
  else { el.classList.add('wrong'); card.querySelectorAll('.mcq-opt')[mcqs[qi].ans].classList.add('correct'); }
  document.getElementById(`exp-${qi}`).classList.add('show');
  updateScore();
}

function updateScore() {
  const pct = mcqAttempted ? Math.round(mcqScore/mcqAttempted*100) : 0;
  document.getElementById('scoreBar').style.width = pct + '%';
  document.getElementById('scoreFraction').textContent = `${mcqScore} correct of ${mcqAttempted} attempted`;
  document.getElementById('scoreLabel').textContent = `${mcqScore}/${mcqAttempted}`;
}

function showPage(name) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const order = ['intro','theories','ionic','ph','buffer','indicators','mcq'];
  const idx = order.indexOf(name);
  if (idx >= 0) document.querySelectorAll('.nav-item')[idx].classList.add('active');
  document.getElementById('mainContent').innerHTML = pages[name] || '';
  if (name === 'mcq') setTimeout(renderMCQs, 50);
  document.getElementById('mainContent').scrollTop = 0;
}

function switchTab(el, targetId) {
  const parent = el.closest('.card');
  parent.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  parent.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const t = document.getElementById(targetId);
  if (t) t.classList.add('active');
}

showPage('intro');
</script>
